  { file = "mcfnlp.parquet", url = "https://huggingface.co/datasets/chuuhtetnaing/english-myanmar-dictionary-dataset-mcfnlp/resolve/d32893d8f1ef98955c69323258e3805227ab0f69/data/train-00000-of-00001.parquet" },
]

