[[pack]]
id = "mcfnlp-en-my"
from = "en"
to = "my"
name = "MCF NLP English–Myanmar dictionary"
converter = "mcfnlp"
version = "mcfnlp/Dictionary (2016), Hugging Face revision d32893d"
