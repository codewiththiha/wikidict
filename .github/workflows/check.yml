name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Packs, catalog and README
        run: python3 tools/check.py
      - name: Comments
        run: python3 tools/comment_check.py
      - name: Commit subjects
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch or a force push has no usable "before": check the tip.
          if [ -n "$BASE" ]; then
            range="$BASE..$HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$HEAD"
          else
            range="$HEAD^!"
          fi
          python3 tools/commit_check.py --range "$range"
